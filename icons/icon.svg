<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#7B6CFF"/>
      <stop offset="0.55" stop-color="#5B4BDB"/>
      <stop offset="1" stop-color="#3E2FB0"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.3" cy="0.2" r="0.8">
      <stop offset="0" stop-color="#FFFFFF" stop-opacity="0.28"/>
      <stop offset="0.6" stop-color="#FFFFFF" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="house" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#FFFFFF"/>
      <stop offset="1" stop-color="#ECEAFF"/>
    </linearGradient>
    <linearGradient id="roof" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#FFB37A"/>
      <stop offset="1" stop-color="#FF7A59"/>
    </linearGradient>
    <linearGradient id="badge" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#3EE0B0"/>
      <stop offset="1" stop-color="#14A57E"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="150%">
      <feDropShadow dx="0" dy="22" stdDeviation="26" flood-color="#1B1060" flood-opacity="0.35"/>
    </filter>
  </defs>

  <!-- sfondo pieno (iOS arrotonda da solo gli angoli) -->
  <rect width="1024" height="1024" fill="url(#bg)"/>
  <rect width="1024" height="1024" fill="url(#glow)"/>

  <g filter="url(#shadow)">
    <!-- corpo della casa -->
    <path d="M262 470 L262 760 Q262 800 302 800 L722 800 Q762 800 762 760 L762 470 Z" fill="url(#house)"/>
    <!-- comignolo -->
    <rect x="640" y="250" width="64" height="150" rx="14" fill="url(#roof)"/>
    <!-- tetto -->
    <path d="M512 196 Q532 196 548 210 L842 470 Q868 494 846 516 Q826 536 802 516 L512 262 L222 516 Q198 536 178 516 Q156 494 182 470 L476 210 Q492 196 512 196 Z" fill="url(#roof)"/>
    <!-- finestra -->
    <rect x="330" y="530" width="120" height="110" rx="22" fill="#5B4BDB" opacity="0.18"/>
    <!-- porta -->
    <path d="M470 800 L470 640 Q470 600 510 600 L554 600 Q594 600 594 640 L594 800 Z" fill="#5B4BDB"/>
    <circle cx="572" cy="705" r="9" fill="#FFFFFF" opacity="0.9"/>
  </g>

  <!-- badge di spunta -->
  <g filter="url(#shadow)">
    <circle cx="760" cy="740" r="132" fill="url(#badge)" stroke="#FFFFFF" stroke-width="22"/>
    <path d="M700 742 L742 784 L824 698" fill="none" stroke="#FFFFFF" stroke-width="34" stroke-linecap="round" stroke-linejoin="round"/>
  </g>
</svg>
