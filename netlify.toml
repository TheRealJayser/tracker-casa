# Sito statico: nessuna build, Netlify pubblica la cartella così com'è.
[build]
  publish = "."

[[headers]]
  for = "/sw.js"
  [headers.values]
    Cache-Control = "no-cache"

[[headers]]
  for = "/*.js"
  [headers.values]
    Cache-Control = "no-cache"

[[headers]]
  for = "/manifest.webmanifest"
  [headers.values]
    Content-Type = "application/manifest+json"

# Login Google su iPhone: inoltra /__/auth/* al progetto Firebase (stesso dominio = niente cookie di terze parti).
# ⚠️ Sostituisci TUO-PROJECT-ID con il projectId di firebase-config.js
[[redirects]]
  from = "/__/auth/*"
  to = "https://TUO-PROJECT-ID.firebaseapp.com/__/auth/:splat"
  status = 200
  force = true

[[redirects]]
  from = "/__/firebase/*"
  to = "https://TUO-PROJECT-ID.firebaseapp.com/__/firebase/:splat"
  status = 200
  force = true
